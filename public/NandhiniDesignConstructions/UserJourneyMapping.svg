<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 480" font-family="'DM Sans', Arial, sans-serif">
  <rect x="0" y="0" width="1240" height="480" fill="#ffffff"/>

  <!-- Column headers (stages) -->
  <g font-size="11" font-weight="700" fill="#ffffff">
    <rect x="130" y="10" width="180" height="40" fill="#0A1F07"/><text x="220" y="34" text-anchor="middle">Discovery</text>
    <rect x="312" y="10" width="180" height="40" fill="#0A1F07"/><text x="402" y="28" text-anchor="middle">Understanding</text><text x="402" y="42" text-anchor="middle">the Offer</text>
    <rect x="494" y="10" width="180" height="40" fill="#0A1F07"/><text x="584" y="28" text-anchor="middle">Evaluating</text><text x="584" y="42" text-anchor="middle">Proof</text>
    <rect x="676" y="10" width="180" height="40" fill="#0A1F07"/><text x="766" y="28" text-anchor="middle">Comparing</text><text x="766" y="42" text-anchor="middle">Packages</text>
    <rect x="858" y="10" width="180" height="40" fill="#0A1F07"/><text x="948" y="34" text-anchor="middle">First Contact</text>
    <rect x="1040" y="10" width="180" height="40" fill="#0A1F07"/><text x="1130" y="34" text-anchor="middle">Committing</text>
  </g>

  <!-- Row labels -->
  <g font-size="10" font-weight="700" fill="#3D6B28" font-family="'IBM Plex Mono', monospace">
    <text x="10" y="90">USER</text><text x="10" y="102">ACTION</text>
    <text x="10" y="190">EMOTION</text>
    <text x="10" y="290">PAIN</text><text x="10" y="302">POINT</text>
    <text x="10" y="400">DESIGN</text><text x="10" y="412">OPPORTUNITY</text>
  </g>

  <!-- Grid lines -->
  <g stroke="#E0DFD5" stroke-width="1">
    <line x1="130" y1="60" x2="1220" y2="60"/>
    <line x1="130" y1="160" x2="1220" y2="160"/>
    <line x1="130" y1="260" x2="1220" y2="260"/>
    <line x1="130" y1="360" x2="1220" y2="360"/>
    <line x1="130" y1="460" x2="1220" y2="460"/>
    <line x1="130" y1="60" x2="130" y2="460"/>
    <line x1="312" y1="60" x2="312" y2="460"/>
    <line x1="494" y1="60" x2="494" y2="460"/>
    <line x1="676" y1="60" x2="676" y2="460"/>
    <line x1="858" y1="60" x2="858" y2="460"/>
    <line x1="1040" y1="60" x2="1040" y2="460"/>
    <line x1="1220" y1="60" x2="1220" y2="460"/>
  </g>

  <!-- Cell text, small, wrapped by hand -->
  <g font-size="9.5" fill="#1E1E1E">
    <!-- Action row -->
    <text x="140" y="78">Lands from district</text><text x="140" y="90">search / referral</text>
    <text x="322" y="78">Reads Services +</text><text x="322" y="90">Packages pages</text>
    <text x="504" y="78">Opens Projects —</text><text x="504" y="90">Stone One etc.</text>
    <text x="686" y="78">Compares 4 tiers</text><text x="686" y="90">by sq.ft / rate</text>
    <text x="868" y="78">Fills Enquiry or taps</text><text x="868" y="90">WhatsApp CTA</text>
    <text x="1050" y="78">Reviews payment</text><text x="1050" y="90">milestones</text>

    <!-- Emotion row -->
    <text x="140" y="178">Cautious,</text><text x="140" y="190">comparison-shopping</text>
    <text x="322" y="178">Translating technical</text><text x="322" y="190">language</text>
    <text x="504" y="178">Looking for proof</text><text x="504" y="190">of delivery</text>
    <text x="686" y="178">Wants a budget</text><text x="686" y="190">anchor</text>
    <text x="868" y="178">Ready, wary of a</text><text x="868" y="190">generic sales process</text>
    <text x="1050" y="178">Needs certainty</text><text x="1050" y="190">before paying</text>

    <!-- Pain point row -->
    <text x="140" y="278">No reason yet to trust</text><text x="140" y="290">a 2025 firm</text>
    <text x="322" y="278">Engineering vocabulary</text><text x="322" y="290">easy to skim past</text>
    <text x="504" y="278">Most projects still</text><text x="504" y="290">in progress, no photos</text>
    <text x="686" y="278">Fixed pricing table</text><text x="686" y="290">feels unfamiliar</text>
    <text x="868" y="278">Forms disappear into</text><text x="868" y="290">a CRM elsewhere</text>
    <text x="1050" y="278">Local contractors</text><text x="1050" y="290">known for payment risk</text>

    <!-- Opportunity row -->
    <text x="140" y="378">Lead with founder</text><text x="140" y="390">credentials up top</text>
    <text x="322" y="378">Pair claims with plain-</text><text x="322" y="390">language outcomes</text>
    <text x="504" y="378">Honest render captions</text><text x="504" y="390">+ live project status</text>
    <text x="686" y="378">Mark the default</text><text x="686" y="390">mid-tier package</text>
    <text x="868" y="378">Enquiry opens a pre-</text><text x="868" y="390">filled WhatsApp chat</text>
    <text x="1050" y="378">Milestones tied to</text><text x="1050" y="390">visible build stages</text>
  </g>
</svg>
