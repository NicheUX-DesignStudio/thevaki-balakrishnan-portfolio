<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 480" font-family="'DM Sans', Arial, sans-serif">
  <rect x="0" y="0" width="1240" height="480" fill="#ffffff"/>

  <!-- connector lines: Home -> level 2 -->
  <g stroke="#1E1E1E" stroke-width="1.5" fill="none">
    <line x1="620" y1="104" x2="150" y2="192"/>
    <line x1="620" y1="104" x2="335" y2="192"/>
    <line x1="620" y1="104" x2="520" y2="192"/>
    <line x1="620" y1="104" x2="705" y2="192"/>
    <line x1="620" y1="104" x2="890" y2="192"/>
    <line x1="620" y1="104" x2="1075" y2="192"/>
    <!-- Services -> sub pages -->
    <line x1="335" y1="254" x2="185" y2="336"/>
    <line x1="335" y1="254" x2="335" y2="336"/>
    <line x1="335" y1="254" x2="485" y2="336"/>
    <!-- Projects -> project pages -->
    <line x1="705" y1="254" x2="705" y2="336"/>
    <line x1="705" y1="254" x2="860" y2="336"/>
    <line x1="705" y1="254" x2="1015" y2="336"/>
    <line x1="705" y1="254" x2="1170" y2="336"/>
  </g>

  <!-- Home -->
  <rect x="500" y="36" width="240" height="68" fill="#0A1F07" rx="2"/>
  <text x="620" y="66" text-anchor="middle" fill="#F5EDD8" font-size="14" font-weight="700">HOME</text>
  <text x="620" y="88" text-anchor="middle" fill="#F5EDD8" font-size="10" font-family="'IBM Plex Mono', monospace" opacity="0.75">nandhinidc.in</text>

  <!-- Level 2 -->
  <g>
    <rect x="60" y="192" width="180" height="62" fill="#ffffff" stroke="#1E1E1E" stroke-width="2" rx="2"/>
    <text x="150" y="228" text-anchor="middle" fill="#1E1E1E" font-size="13" font-weight="700">About</text>

    <rect x="245" y="192" width="180" height="62" fill="#3D6B28" rx="2"/>
    <text x="335" y="228" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Services</text>

    <rect x="430" y="192" width="180" height="62" fill="#ffffff" stroke="#1E1E1E" stroke-width="2" rx="2"/>
    <text x="520" y="228" text-anchor="middle" fill="#1E1E1E" font-size="13" font-weight="700">Packages</text>

    <rect x="615" y="192" width="180" height="62" fill="#3D6B28" rx="2"/>
    <text x="705" y="228" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Projects</text>

    <rect x="800" y="192" width="180" height="62" fill="#ffffff" stroke="#1E1E1E" stroke-width="2" rx="2"/>
    <text x="890" y="228" text-anchor="middle" fill="#1E1E1E" font-size="13" font-weight="700">Contact</text>

    <rect x="985" y="192" width="180" height="62" fill="#C8973A" rx="2"/>
    <text x="1075" y="222" text-anchor="middle" fill="#1E1E1E" font-size="13" font-weight="700">Enquiry</text>
    <text x="1075" y="240" text-anchor="middle" fill="#1E1E1E" font-size="9" font-family="'IBM Plex Mono', monospace" opacity="0.75">WhatsApp</text>
  </g>

  <!-- Level 3: Services children -->
  <g>
    <rect x="105" y="336" width="160" height="60" fill="#F5EDD8" stroke="#3D6B28" stroke-width="1.5" rx="2"/>
    <text x="185" y="362" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">House</text>
    <text x="185" y="378" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">Construction</text>

    <rect x="255" y="336" width="160" height="60" fill="#F5EDD8" stroke="#3D6B28" stroke-width="1.5" rx="2"/>
    <text x="335" y="362" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">Architectural</text>
    <text x="335" y="378" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">Planning</text>

    <rect x="405" y="336" width="160" height="60" fill="#F5EDD8" stroke="#3D6B28" stroke-width="1.5" rx="2"/>
    <text x="485" y="362" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">Structural</text>
    <text x="485" y="378" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">Design</text>
  </g>

  <!-- Level 3: Project children -->
  <g>
    <rect x="625" y="336" width="160" height="60" fill="#F5EDD8" stroke="#C8973A" stroke-width="1.5" rx="2"/>
    <text x="705" y="362" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">01 Stone One</text>
    <text x="705" y="378" text-anchor="middle" fill="#8A8A8A" font-size="9" font-family="'IBM Plex Mono', monospace">Marakkanam</text>

    <rect x="780" y="336" width="160" height="60" fill="#F5EDD8" stroke="#C8973A" stroke-width="1.5" rx="2"/>
    <text x="860" y="362" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">02 Second Gear</text>
    <text x="860" y="378" text-anchor="middle" fill="#8A8A8A" font-size="9" font-family="'IBM Plex Mono', monospace">Kumbakonam</text>

    <rect x="935" y="336" width="160" height="60" fill="#F5EDD8" stroke="#C8973A" stroke-width="1.5" rx="2"/>
    <text x="1015" y="362" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">03 Third Moon</text>
    <text x="1015" y="378" text-anchor="middle" fill="#8A8A8A" font-size="9" font-family="'IBM Plex Mono', monospace">Nannilam</text>

    <rect x="1090" y="336" width="160" height="60" fill="#F5EDD8" stroke="#C8973A" stroke-width="1.5" stroke-dasharray="4 3" rx="2"/>
    <text x="1170" y="362" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">04 Fourth Pillar</text>
    <text x="1170" y="378" text-anchor="middle" fill="#8A8A8A" font-size="9" font-family="'IBM Plex Mono', monospace">Thiruvallur, in design</text>
  </g>

  <!-- Legend -->
  <g font-size="10" font-family="'IBM Plex Mono', monospace" fill="#1E1E1E">
    <rect x="60" y="432" width="12" height="12" fill="#3D6B28"/>
    <text x="78" y="442">Multi-page section</text>
    <rect x="270" y="432" width="12" height="12" fill="#C8973A"/>
    <text x="288" y="442">Conversion route</text>
    <rect x="440" y="432" width="12" height="12" fill="#ffffff" stroke="#1E1E1E"/>
    <text x="458" y="442">Static page</text>
  </g>
</svg>
