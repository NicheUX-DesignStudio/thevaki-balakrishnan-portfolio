<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="'DM Sans', Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="460" fill="#ffffff"/>

  <!-- connector lines: Home -> level 2 -->
  <g stroke="#1E1E1E" stroke-width="1.5" fill="none">
    <line x1="600" y1="102" x2="150" y2="190"/>
    <line x1="600" y1="102" x2="330" y2="190"/>
    <line x1="600" y1="102" x2="510" y2="190"/>
    <line x1="600" y1="102" x2="690" y2="190"/>
    <line x1="600" y1="102" x2="870" y2="190"/>
    <line x1="600" y1="102" x2="1050" y2="190"/>
    <!-- Services -> sub pages -->
    <line x1="330" y1="250" x2="165" y2="330"/>
    <line x1="330" y1="250" x2="330" y2="330"/>
    <line x1="330" y1="250" x2="495" y2="330"/>
    <!-- Projects -> project pages -->
    <line x1="690" y1="250" x2="660" y2="330"/>
    <line x1="690" y1="250" x2="815" y2="330"/>
    <line x1="690" y1="250" x2="970" y2="330"/>
    <line x1="690" y1="250" x2="1125" y2="330"/>
  </g>

  <!-- Home -->
  <rect x="490" y="38" width="220" height="64" fill="#0A1A06" stroke="#0A1A06" stroke-width="2" rx="2"/>
  <text x="600" y="65" text-anchor="middle" fill="#F7F5EF" font-size="14" font-weight="700">HOME</text>
  <text x="600" y="86" text-anchor="middle" fill="#F7F5EF" font-size="10" font-family="'IBM Plex Mono', monospace">nandhinidc.in</text>

  <!-- Level 2 -->
  <g>
    <rect x="70" y="190" width="160" height="60" fill="#ffffff" stroke="#1E1E1E" stroke-width="2" rx="2"/>
    <text x="150" y="216" text-anchor="middle" fill="#1E1E1E" font-size="13" font-weight="700">About</text>
    <text x="150" y="234" text-anchor="middle" fill="#8A9A7E" font-size="9" font-family="'IBM Plex Mono', monospace">/about</text>

    <rect x="250" y="190" width="160" height="60" fill="#4A7A28" stroke="#1E1E1E" stroke-width="2" rx="2"/>
    <text x="330" y="216" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Services</text>
    <text x="330" y="234" text-anchor="middle" fill="#F7F5EF" font-size="9" font-family="'IBM Plex Mono', monospace">/services</text>

    <rect x="430" y="190" width="160" height="60" fill="#ffffff" stroke="#1E1E1E" stroke-width="2" rx="2"/>
    <text x="510" y="216" text-anchor="middle" fill="#1E1E1E" font-size="13" font-weight="700">Packages</text>
    <text x="510" y="234" text-anchor="middle" fill="#8A9A7E" font-size="9" font-family="'IBM Plex Mono', monospace">/packages</text>

    <rect x="610" y="190" width="160" height="60" fill="#4A7A28" stroke="#1E1E1E" stroke-width="2" rx="2"/>
    <text x="690" y="216" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Projects</text>
    <text x="690" y="234" text-anchor="middle" fill="#F7F5EF" font-size="9" font-family="'IBM Plex Mono', monospace">/projects</text>

    <rect x="790" y="190" width="160" height="60" fill="#ffffff" stroke="#1E1E1E" stroke-width="2" rx="2"/>
    <text x="870" y="216" text-anchor="middle" fill="#1E1E1E" font-size="13" font-weight="700">Contact</text>
    <text x="870" y="234" text-anchor="middle" fill="#8A9A7E" font-size="9" font-family="'IBM Plex Mono', monospace">/contact</text>

    <rect x="970" y="190" width="160" height="60" fill="#C8A84B" stroke="#1E1E1E" stroke-width="2" rx="2"/>
    <text x="1050" y="216" text-anchor="middle" fill="#1E1E1E" font-size="13" font-weight="700">Enquiry</text>
    <text x="1050" y="234" text-anchor="middle" fill="#1E1E1E" font-size="9" font-family="'IBM Plex Mono', monospace">/enquiry · WhatsApp</text>
  </g>

  <!-- Level 3: Services children -->
  <g>
    <rect x="90" y="330" width="150" height="56" fill="#F7F5EF" stroke="#4A7A28" stroke-width="1.5" rx="2"/>
    <text x="165" y="354" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">House</text>
    <text x="165" y="368" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">Construction</text>

    <rect x="255" y="330" width="150" height="56" fill="#F7F5EF" stroke="#4A7A28" stroke-width="1.5" rx="2"/>
    <text x="330" y="354" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">Architectural</text>
    <text x="330" y="368" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">Planning</text>

    <rect x="420" y="330" width="150" height="56" fill="#F7F5EF" stroke="#4A7A28" stroke-width="1.5" rx="2"/>
    <text x="495" y="354" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">Structural</text>
    <text x="495" y="368" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">Design</text>
  </g>

  <!-- Level 3: Project children -->
  <g>
    <rect x="590" y="330" width="140" height="56" fill="#F7F5EF" stroke="#C8A84B" stroke-width="1.5" rx="2"/>
    <text x="660" y="354" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">01 · Stone One</text>
    <text x="660" y="368" text-anchor="middle" fill="#8A9A7E" font-size="9" font-family="'IBM Plex Mono', monospace">Marakkanam</text>

    <rect x="745" y="330" width="140" height="56" fill="#F7F5EF" stroke="#C8A84B" stroke-width="1.5" rx="2"/>
    <text x="815" y="354" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">02 · Second Gear</text>
    <text x="815" y="368" text-anchor="middle" fill="#8A9A7E" font-size="9" font-family="'IBM Plex Mono', monospace">in design</text>

    <rect x="900" y="330" width="140" height="56" fill="#F7F5EF" stroke="#C8A84B" stroke-width="1.5" rx="2"/>
    <text x="970" y="354" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">03 · Third Moon</text>
    <text x="970" y="368" text-anchor="middle" fill="#8A9A7E" font-size="9" font-family="'IBM Plex Mono', monospace">in design</text>

    <rect x="1055" y="330" width="140" height="56" fill="#F7F5EF" stroke="#C8A84B" stroke-width="1.5" rx="2"/>
    <text x="1125" y="354" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="600">04 · Fourth Pillar</text>
    <text x="1125" y="368" text-anchor="middle" fill="#8A9A7E" font-size="9" font-family="'IBM Plex Mono', monospace">in design</text>
  </g>

  <!-- Legend -->
  <g font-size="10" font-family="'IBM Plex Mono', monospace" fill="#1E1E1E">
    <rect x="70" y="415" width="12" height="12" fill="#4A7A28"/>
    <text x="88" y="425">Multi-page section</text>
    <rect x="250" y="415" width="12" height="12" fill="#C8A84B"/>
    <text x="268" y="425">Conversion route (WhatsApp / quotation)</text>
    <rect x="560" y="415" width="12" height="12" fill="#ffffff" stroke="#1E1E1E"/>
    <text x="578" y="425">Static page</text>
  </g>
</svg>
