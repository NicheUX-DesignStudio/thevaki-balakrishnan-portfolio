<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" font-family="'DM Sans', Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1E1E1E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="400" fill="#ffffff"/>
  <text x="20" y="26" font-size="12" font-weight="700" fill="#8A8A8A" font-family="'IBM Plex Mono', monospace">EDGE CASE: FORMAL QUOTATION VIA THE ENQUIRY ROUTE</text>

  <g stroke="#1E1E1E" stroke-width="2" marker-end="url(#arrow2)">
    <line x1="420" y1="100" x2="450" y2="100"/>
    <line x1="820" y1="100" x2="850" y2="100"/>
  </g>
  <path d="M1180,145 L1180,200 L1180,245" stroke="#1E1E1E" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <g stroke="#1E1E1E" stroke-width="2" marker-end="url(#arrow2)">
    <line x1="820" y1="290" x2="790" y2="290"/>
    <line x1="420" y1="290" x2="390" y2="290"/>
  </g>

  <!-- 1 start -->
  <rect x="40" y="55" width="380" height="90" rx="45" fill="#3D6B28"/>
  <text x="230" y="93" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">01 Wants a formal quotation</text>
  <text x="230" y="111" text-anchor="middle" fill="#F5EDD8" font-size="10">not just a general chat</text>

  <!-- 2 action -->
  <rect x="450" y="55" width="370" height="90" fill="#ffffff" stroke="#1E1E1E" stroke-width="2" rx="4"/>
  <text x="635" y="93" text-anchor="middle" fill="#1E1E1E" font-size="12" font-weight="700">02 Opens Enquiry</text>
  <text x="635" y="111" text-anchor="middle" fill="#8A8A8A" font-size="10">instead of general Contact</text>

  <!-- 3 action -->
  <rect x="850" y="55" width="330" height="90" fill="#ffffff" stroke="#1E1E1E" stroke-width="2" rx="4"/>
  <text x="1015" y="93" text-anchor="middle" fill="#1E1E1E" font-size="12" font-weight="700">03 Enters plot detail</text>
  <text x="1015" y="111" text-anchor="middle" fill="#8A8A8A" font-size="10">district, budget, timeline</text>

  <!-- 4 action -->
  <rect x="850" y="245" width="330" height="90" fill="#ffffff" stroke="#1E1E1E" stroke-width="2" rx="4"/>
  <text x="1015" y="283" text-anchor="middle" fill="#1E1E1E" font-size="12" font-weight="700">04 Adds optional notes</text>
  <text x="1015" y="301" text-anchor="middle" fill="#8A8A8A" font-size="10">Vastu or family needs</text>

  <!-- 5 action -->
  <rect x="450" y="245" width="370" height="90" fill="#ffffff" stroke="#1E1E1E" stroke-width="2" rx="4"/>
  <text x="635" y="283" text-anchor="middle" fill="#1E1E1E" font-size="12" font-weight="700">05 Submits form</text>
  <text x="635" y="301" text-anchor="middle" fill="#8A8A8A" font-size="10">WhatsApp opens pre-filled</text>

  <!-- 6 end -->
  <rect x="40" y="245" width="380" height="90" fill="#0A1F07" rx="4"/>
  <text x="230" y="283" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">06 Founder replies</text>
  <text x="230" y="301" text-anchor="middle" fill="#F5EDD8" font-size="10">personally, within a working day</text>
</svg>
