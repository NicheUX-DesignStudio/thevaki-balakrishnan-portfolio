<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 900" font-family="'DM Sans', Arial, sans-serif">
  <rect x="0.5" y="0.5" width="374" height="899" fill="#ffffff" stroke="#1E1E1E"/>

  <text x="16" y="34" font-size="16" font-weight="700" fill="#1E1E1E">‹ Packages</text>
  <line x1="0" y1="56" x2="375" y2="56" stroke="#E0E0E0"/>
  <text x="16" y="86" font-size="15" font-weight="700" fill="#1E1E1E">Six honest packages.</text>
  <text x="16" y="104" font-size="10" fill="#8A9A7E">Counted honestly. Updated as the firm grows.</text>

  <!-- package card 1 -->
  <rect x="16" y="126" width="343" height="120" rx="3" fill="#ffffff" stroke="#1E1E1E" stroke-width="1.5"/>
  <text x="32" y="150" font-size="12" font-weight="700" fill="#1E1E1E">Foundation</text>
  <text x="32" y="168" font-size="9.5" fill="#8A9A7E">2,400 sq.ft · Under ₹25 L</text>
  <rect x="32" y="182" width="200" height="7" fill="#8A9A7E"/>
  <rect x="32" y="194" width="150" height="7" fill="#8A9A7E"/>
  <text x="303" y="150" text-anchor="end" font-size="13" font-weight="700" fill="#1E1E1E">₹ / sq.ft</text>
  <rect x="32" y="218" width="90" height="18" rx="2" fill="#0A1A06"/>
  <text x="77" y="231" text-anchor="middle" font-size="9" fill="#ffffff">View spec →</text>

  <!-- package card 2 - highlighted -->
  <rect x="16" y="256" width="343" height="130" rx="3" fill="#F7F5EF" stroke="#4A7A28" stroke-width="2.5"/>
  <rect x="32" y="266" width="120" height="14" fill="#4A7A28"/>
  <text x="38" y="277" font-size="8" font-weight="700" fill="#ffffff">MOST HOMEOWNERS CHOOSE</text>
  <text x="32" y="300" font-size="12" font-weight="700" fill="#1E1E1E">The Considered Build</text>
  <text x="32" y="318" font-size="9.5" fill="#8A9A7E">3,200 sq.ft</text>
  <rect x="32" y="330" width="200" height="7" fill="#8A9A7E"/>
  <rect x="32" y="342" width="150" height="7" fill="#8A9A7E"/>
  <rect x="32" y="360" width="90" height="18" rx="2" fill="#0A1A06"/>
  <text x="77" y="373" text-anchor="middle" font-size="9" fill="#ffffff">View spec →</text>

  <!-- package card 3 -->
  <rect x="16" y="396" width="343" height="120" rx="3" fill="#ffffff" stroke="#1E1E1E" stroke-width="1.5"/>
  <text x="32" y="420" font-size="12" font-weight="700" fill="#1E1E1E">Singapore-Grade</text>
  <text x="32" y="438" font-size="9.5" fill="#8A9A7E">3,800 sq.ft</text>
  <rect x="32" y="452" width="200" height="7" fill="#8A9A7E"/>
  <rect x="32" y="464" width="150" height="7" fill="#8A9A7E"/>
  <rect x="32" y="488" width="90" height="18" rx="2" fill="#0A1A06"/>
  <text x="77" y="501" text-anchor="middle" font-size="9" fill="#ffffff">View spec →</text>

  <!-- package card 4 -->
  <rect x="16" y="536" width="343" height="120" rx="3" fill="#ffffff" stroke="#1E1E1E" stroke-width="1.5"/>
  <text x="32" y="560" font-size="12" font-weight="700" fill="#1E1E1E">The Full Package</text>
  <text x="32" y="578" font-size="9.5" fill="#8A9A7E">4,100 sq.ft · Walkthrough VR</text>
  <rect x="32" y="592" width="200" height="7" fill="#8A9A7E"/>
  <rect x="32" y="604" width="150" height="7" fill="#8A9A7E"/>
  <rect x="32" y="628" width="90" height="18" rx="2" fill="#0A1A06"/>
  <text x="77" y="641" text-anchor="middle" font-size="9" fill="#ffffff">View spec →</text>

  <!-- beyond the package -->
  <rect x="16" y="678" width="343" height="70" fill="#F7F5EF" stroke="#C8A84B" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="187" y="704" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1E1E">Beyond the package</text>
  <text x="187" y="720" text-anchor="middle" font-size="9" fill="#8A9A7E">A bespoke brief. Talk to us directly.</text>

  <rect x="87" y="792" width="200" height="44" rx="4" fill="#0A1A06"/>
  <text x="187" y="819" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Tell us about your plot</text>
</svg>
