<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 900" font-family="'DM Sans', Arial, sans-serif">
  <defs>
    <pattern id="hatchProj" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#B8B8B8" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect x="0.5" y="0.5" width="374" height="899" fill="#ffffff" stroke="#1E1E1E"/>

  <text x="16" y="34" font-size="16" font-weight="700" fill="#1E1E1E">‹ 01 / Stone One</text>
  <rect x="290" y="18" width="70" height="20" rx="10" fill="#4A7A28"/>
  <text x="325" y="32" text-anchor="middle" font-size="8" font-weight="700" fill="#ffffff">HIGHLIGHTED</text>
  <line x1="0" y1="56" x2="375" y2="56" stroke="#E0E0E0"/>

  <!-- hero render -->
  <rect x="0" y="56" width="375" height="240" fill="url(#hatchProj)" stroke="#B8B8B8"/>
  <rect x="16" y="270" width="220" height="9" fill="#ffffff"/>
  <text x="16" y="280" font-size="8" fill="#1E1E1E"> </text>

  <!-- daylight toggle -->
  <g>
    <rect x="16" y="308" width="343" height="34" rx="17" fill="#F7F5EF" stroke="#1E1E1E" stroke-width="1.5"/>
    <rect x="20" y="312" width="108" height="26" rx="13" fill="#0A1A06"/>
    <text x="74" y="329" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="700">Morning</text>
    <text x="187" y="329" text-anchor="middle" font-size="9" fill="#1E1E1E">Golden Hour</text>
    <text x="300" y="329" text-anchor="middle" font-size="9" fill="#1E1E1E">Dusk</text>
  </g>
  <text x="16" y="366" font-size="9" fill="#8A9A7E" font-style="italic">A rendered study. Real shadows arrive with the build.</text>

  <!-- meta row -->
  <g>
    <rect x="16" y="386" width="105" height="60" fill="#F7F5EF" stroke="#E0E0E0"/>
    <text x="24" y="402" font-size="8" fill="#8A9A7E" font-family="'IBM Plex Mono', monospace">DISTRICT</text>
    <text x="24" y="420" font-size="10.5" font-weight="700" fill="#1E1E1E">Villupuram</text>

    <rect x="135" y="386" width="105" height="60" fill="#F7F5EF" stroke="#E0E0E0"/>
    <text x="143" y="402" font-size="8" fill="#8A9A7E" font-family="'IBM Plex Mono', monospace">TYPE</text>
    <text x="143" y="420" font-size="10.5" font-weight="700" fill="#1E1E1E">Villa, courtyard</text>

    <rect x="254" y="386" width="105" height="60" fill="#F7F5EF" stroke="#E0E0E0"/>
    <text x="262" y="402" font-size="8" fill="#8A9A7E" font-family="'IBM Plex Mono', monospace">STATUS</text>
    <text x="262" y="420" font-size="10.5" font-weight="700" fill="#4A7A28">Currently highlighted</text>
  </g>

  <!-- narrative -->
  <text x="16" y="478" font-size="12" font-weight="700" fill="#1E1E1E">A villa folded around its</text>
  <text x="16" y="496" font-size="12" font-weight="700" fill="#1E1E1E">courtyard.</text>
  <rect x="16" y="512" width="343" height="7" fill="#8A9A7E"/>
  <rect x="16" y="524" width="290" height="7" fill="#8A9A7E"/>
  <rect x="16" y="536" width="310" height="7" fill="#8A9A7E"/>

  <!-- image gallery -->
  <g>
    <rect x="16" y="562" width="110" height="90" fill="url(#hatchProj)" stroke="#B8B8B8"/>
    <rect x="132" y="562" width="110" height="90" fill="url(#hatchProj)" stroke="#B8B8B8"/>
    <rect x="248" y="562" width="111" height="90" fill="url(#hatchProj)" stroke="#B8B8B8"/>
  </g>
  <text x="16" y="548" font-size="9" fill="#8A9A7E" font-family="'IBM Plex Mono', monospace">EXTERIOR · INTERIOR · EVENING GLOW</text>

  <!-- milestone timeline -->
  <text x="16" y="682" font-size="11" font-weight="700" fill="#1E1E1E">From first sketch to handover</text>
  <g stroke="#1E1E1E" stroke-width="2"><line x1="30" y1="700" x2="345" y2="700"/></g>
  <g>
    <circle cx="30" cy="700" r="6" fill="#0A1A06"/>
    <circle cx="115" cy="700" r="6" fill="#0A1A06"/>
    <circle cx="200" cy="700" r="6" fill="#4A7A28"/>
    <circle cx="285" cy="700" r="6" fill="#E0E0E0" stroke="#1E1E1E"/>
    <circle cx="345" cy="700" r="6" fill="#E0E0E0" stroke="#1E1E1E"/>
  </g>
  <text x="30" y="722" font-size="7.5" text-anchor="middle" fill="#1E1E1E">Site &amp; foundation</text>
  <text x="115" y="722" font-size="7.5" text-anchor="middle" fill="#1E1E1E">Structure</text>
  <text x="200" y="722" font-size="7.5" text-anchor="middle" fill="#1E1E1E">Finishing</text>
  <text x="285" y="722" font-size="7.5" text-anchor="middle" fill="#1E1E1E">Snagging</text>
  <text x="345" y="722" font-size="7.5" text-anchor="middle" fill="#1E1E1E">Handover</text>

  <rect x="87" y="792" width="200" height="44" rx="4" fill="#0A1A06"/>
  <text x="187" y="819" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Discuss a similar build</text>
</svg>
