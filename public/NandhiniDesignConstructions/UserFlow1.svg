<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" font-family="'DM Sans', Arial, sans-serif">
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1E1E1E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="400" fill="#ffffff"/>
  <text x="20" y="26" font-size="12" font-weight="700" fill="#8A8A8A" font-family="'IBM Plex Mono', monospace">PRIMARY FLOW: HOMEPAGE TO WHATSAPP ENQUIRY</text>

  <g stroke="#1E1E1E" stroke-width="2" marker-end="url(#arrow1)">
    <line x1="320" y1="100" x2="350" y2="100"/>
    <line x1="630" y1="100" x2="660" y2="100"/>
    <line x1="940" y1="100" x2="970" y2="100"/>
  </g>
  <path d="M1180,145 L1180,200 L1180,245" stroke="#1E1E1E" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>
  <g stroke="#1E1E1E" stroke-width="2" marker-end="url(#arrow1)">
    <line x1="940" y1="290" x2="910" y2="290"/>
    <line x1="630" y1="290" x2="600" y2="290"/>
    <line x1="320" y1="290" x2="290" y2="290"/>
  </g>

  <!-- Row 1: steps 1-4 -->
  <rect x="60" y="55" width="260" height="90" rx="45" fill="#3D6B28"/>
  <text x="190" y="97" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">01 Land on Homepage</text>
  <text x="190" y="115" text-anchor="middle" fill="#F5EDD8" font-size="10">via district search or referral</text>

  <rect x="350" y="55" width="280" height="90" fill="#ffffff" stroke="#1E1E1E" stroke-width="2" rx="4"/>
  <text x="490" y="93" text-anchor="middle" fill="#1E1E1E" font-size="12" font-weight="700">02 Read positioning</text>
  <text x="490" y="111" text-anchor="middle" fill="#8A8A8A" font-size="10">"We engineer, not estimate"</text>

  <rect x="660" y="55" width="280" height="90" fill="#ffffff" stroke="#1E1E1E" stroke-width="2" rx="4"/>
  <text x="800" y="93" text-anchor="middle" fill="#1E1E1E" font-size="12" font-weight="700">03 Open Services</text>
  <text x="800" y="111" text-anchor="middle" fill="#8A8A8A" font-size="10">reviews structural claims</text>

  <rect x="970" y="55" width="210" height="90" fill="#ffffff" stroke="#1E1E1E" stroke-width="2" rx="4"/>
  <text x="1075" y="93" text-anchor="middle" fill="#1E1E1E" font-size="12" font-weight="700">04 Compares</text>
  <text x="1075" y="111" text-anchor="middle" fill="#8A8A8A" font-size="10">Packages by sq.ft</text>

  <!-- Row 2: steps 5-8 -->
  <rect x="970" y="245" width="210" height="90" fill="#ffffff" stroke="#1E1E1E" stroke-width="2" rx="4"/>
  <text x="1075" y="283" text-anchor="middle" fill="#1E1E1E" font-size="12" font-weight="700">05 Opens Projects</text>
  <text x="1075" y="301" text-anchor="middle" fill="#8A8A8A" font-size="10">views Stone One</text>

  <polygon points="800,245 915,290 800,335 685,290" fill="#C8973A" stroke="#1E1E1E" stroke-width="2"/>
  <text x="800" y="285" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="700">06 Taps WhatsApp</text>
  <text x="800" y="301" text-anchor="middle" fill="#1E1E1E" font-size="11" font-weight="700">the founders</text>

  <rect x="350" y="245" width="280" height="90" fill="#ffffff" stroke="#1E1E1E" stroke-width="2" rx="4"/>
  <text x="490" y="283" text-anchor="middle" fill="#1E1E1E" font-size="12" font-weight="700">07 Pre-filled message</text>
  <text x="490" y="301" text-anchor="middle" fill="#8A8A8A" font-size="10">opens directly in WhatsApp</text>

  <rect x="60" y="245" width="260" height="90" fill="#0A1F07" rx="4"/>
  <text x="190" y="283" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">08 Tap send</text>
  <text x="190" y="301" text-anchor="middle" fill="#F5EDD8" font-size="10">founder replies personally</text>
</svg>
